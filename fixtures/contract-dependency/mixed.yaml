description: >
  A dependency set containing direct edges, a transitive edge, a mutual invocation
  pair that forms a cycle, and one unresolved lookup. It exists to exercise the parts
  of the model that are easiest to omit: the cycle is reported rather than resolved,
  the direct and transitive lists partition the dependency edges, and the unresolved
  entry keeps a lookup failure visible instead of letting it look like an absence of
  dependency.
