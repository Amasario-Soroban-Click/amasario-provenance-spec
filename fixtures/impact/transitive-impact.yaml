apiVersion: amasario.dev/v1
specVersion: 1.0.0
id: impact/transitive-impact
kind: valid
synthetic: true
target: https://amasario.dev/spec/v1/schema/impact.schema.json
description: >
  A two-hop impact finding: a source revision changes, which reaches the build
  produced from it, which reaches the artifact derived from that build. Each step
  carries its own evidence and the finding's confidence is the minimum across the
  path, so the result is MEDIUM_CONFIDENCE even though the first hop alone is
  stronger.
document:
  id: impact_source_revision_changed_artifact_affected
  changedEntity:
    kind: SOURCE
    id: https://example.invalid/amasario/alpha-contract@5516af291249414332282f5b6655c9033f73e3fc
  affectedEntity:
    kind: ARTIFACT
    id: artifact_wasm_alpha
    digest:
      algorithm: sha256
      value: 4bb771fa2d803b40bb8402ab976668ac64b600f4c4187c27483d7dd693a686a3
  impactType:
    - TRANSITIVE
    - ARTIFACT
  hopDepth: 2
  path:
    nodes:
      - kind: SOURCE
        id: https://example.invalid/amasario/alpha-contract@5516af291249414332282f5b6655c9033f73e3fc
      - kind: BUILD
        id: build_alpha_v1
      - kind: ARTIFACT
        id: artifact_wasm_alpha
    steps:
      - source:
          kind: BUILD
          id: build_alpha_v1
        target:
          kind: SOURCE
          id: https://example.invalid/amasario/alpha-contract@5516af291249414332282f5b6655c9033f73e3fc
        relationship: BUILT_FROM
        edgeId: edge_build_alpha_source
        direction: inverted
        evidence:
          - ev_source_revision
        confidence:
          level: HIGH_CONFIDENCE
          evidence:
            - ev_source_revision
      - source:
          kind: ARTIFACT
          id: artifact_wasm_alpha
        target:
          kind: BUILD
          id: build_alpha_v1
        relationship: DERIVED_FROM
        edgeId: edge_artifact_wasm_build
        direction: inverted
        evidence:
          - ev_artifact_wasm
        confidence:
          level: MEDIUM_CONFIDENCE
          evidence:
            - ev_artifact_wasm
          rationale: The derivation is recorded but the artifact was observed at a different boundary from the build record.
    hopDepth: 2
    direction: DEPENDENTS
    termination: TARGET_REACHED
    confidence:
      level: MEDIUM_CONFIDENCE
      evidence:
        - ev_source_revision
        - ev_artifact_wasm
  relationshipTypes:
    - BUILT_FROM
    - DERIVED_FROM
  direction: DEPENDENTS
  changeType: MODIFIED
  evidence:
    - ev_source_revision
    - ev_artifact_wasm
  confidence:
    level: MEDIUM_CONFIDENCE
    evidence:
      - ev_source_revision
      - ev_artifact_wasm
    rationale: The path is two hops and the second hop is supported less strongly than the first, so the aggregated level is the minimum ordinal across the steps.
    aggregation:
      strategy: minimum_ordinal
      inputs:
        - claim: The build was produced from the changed source revision.
          level: HIGH_CONFIDENCE
        - claim: The artifact was derived from that build.
          level: MEDIUM_CONFIDENCE
  reason: The artifact artifact_wasm_alpha was derived from the build build_alpha_v1, which was produced from the changed source revision, so a change to that revision may invalidate the derived artifact.
  verificationState: PARTIALLY_VERIFIED
  truncated: false
