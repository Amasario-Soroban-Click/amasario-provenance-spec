id: impact/direct-impact
kind: valid
synthetic: true
target: https://amasario.dev/spec/v1/schema/impact.schema.json
description: >
  A single-hop impact finding: a source revision changes, so the build produced from
  it is affected. The hop is traversed inverted, against the arrow of the BUILT_FROM
  edge, because a change to a dependency reaches its dependents. The fixture records
  that direction explicitly instead of leaving a reader to infer it from the hop
  count.
