apiVersion: amasario.dev/v1
specVersion: 1.0.0
id: minimal-provenance
kind: valid
synthetic: true
target: https://amasario.dev/spec/v1/schema/provenance.schema.json
description: >
  The least a caller can supply and still have a provenance document: a contract
  identity, one piece of evidence and an observation boundary. Everything about the
  chain is unknown, and the document says so rather than leaving the fields out and
  letting a reader guess whether they were unobserved or unrecorded.
document:
  apiVersion: amasario.dev/v1
  specVersion: 1.0.0
  contract:
    contractId: C5AW7RAJS26BSZ27BPUE62MOJ3C6WUZC2M6HJG66BDXHEBLDRBMRKQSP
    network: &net
      id: testnet
      type: TESTNET
      passphrase: 'Test SDF Network ; September 2015'
      networkId: cee0302d59844d32bdca915c8203dd44b33fbb7edc19051ea37abedf28ecd472
      rpcUrl: https://soroban-testnet.stellar.org
    identityVersion: 1
    executableType: UNKNOWN
    evidence:
      - ev_presence
  evidence:
    - id: ev_presence
      type: OBSERVATION
      claim: The address C5AW7RAJS26BSZ27BPUE62MOJ3C6WUZC2M6HJG66BDXHEBLDRBMRKQSP was returned by the network at ledger 1234789.
      observedAt: '2026-01-15T12:30:00Z'
      observationNote: The contract address was queried and the network returned an entry for it. No executable hash was read during this observation.
      boundary:
        network: *net
        ledger: 1234789
        observedAt: '2026-01-15T12:30:00Z'
  confidence:
    level: UNKNOWN
    evidence:
      - ev_presence
    rationale: Only the existence of the address is evidenced. No executable hash, source or build information was established, so no provenance claim can be made.
  verificationStatus: UNVERIFIED
  boundary:
    network: *net
    ledger: 1234789
    observedAt: '2026-01-15T12:30:00Z'
