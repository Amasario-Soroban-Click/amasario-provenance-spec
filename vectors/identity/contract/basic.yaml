apiVersion: amasario.dev/v1
specVersion: 1.0.0
id: identity/contract/basic
domain: identity
operation: contract-identity-key
deterministic: true
description: >
  Derives the stable identity key of a contract identity and its normalised form. The
  key is composed of the specification version family, the entity kind, the network
  and the address, and deliberately excludes the executable hash: a change of
  executable is a change of identity version, not a change of identity, so that an
  upgrade does not appear as a new contract. A consumer in the engine repository is
  expected to reproduce this key byte for byte.
