apiVersion: amasario.dev/v1
specVersion: 1.0.0
id: provenance/contract
name: Contract Identity Model
modelKind: entity
concept: CONTRACT
description: >
  The canonical identity of a Soroban contract. This model exists because the
  question "which contract is this?" has no single-field answer: an address is
  unique only within a network, and an address can host different executables over
  time as it is upgraded. Complete identity therefore requires an address, a
  network, an executable and an identity version together.
schema:
  id: https://amasario.dev/spec/v1/schema/contract.schema.json
  pointer: ''
fields:
  - name: contractId
    type: string
    requirement: always
    description: The strkey-encoded contract address.
  - name: network
    type: object
    requirement: always
    description: The network the identity was observed on. Required because a contract address is only unique within a network.
  - name: identityVersion
    type: integer
    requirement: always
    description: Version of this identity record. Increments whenever any identity-defining field changes.
  - name: wasmHash
    type: object
    requirement: optional
    description: Hash of the executable hosted at this identity version. Without it an address establishes no provenance.
  - name: ledgerSequence
    type: integer
    requirement: optional
    description: The ledger at which this identity was most recently established.
  - name: firstObservedLedger
    type: integer
    requirement: optional
    description: Earliest ledger at which this address was observed to exist.
  - name: lastObservedLedger
    type: integer
    requirement: optional
    description: Latest ledger at which this identity was observed to hold.
  - name: deploymentTransaction
    type: string
    requirement: optional
    description: Hash of the transaction that created the contract, when identified.
  - name: deploymentOperation
    type: integer
    requirement: optional
    description: Zero-based operation index of the deployment within its transaction.
  - name: executableType
    type: string
    requirement: optional
    description: The kind of executable behind the address, so a Stellar Asset Contract is not forced to have a WASM hash.
relations:
  - kind: DEPLOYED_AS
    description: A contract identity is the object of DEPLOYED_AS from the executable that was deployed as it.
  - kind: OBSERVED_IN
    description: A contract identity is observed in the transactions that established or upgraded it.
taxonomies:
  - network-types
invariants:
  - lastObservedLedger must not be less than firstObservedLedger.
  - A contract whose executableType is STELLAR_ASSET must not carry a wasmHash, because a built-in executable has no user-uploaded module.
  - identityVersion must be at least 1, and two records with the same contractId and different identityVersion are different identities rather than conflicting observations of one.
nonGoals:
  - This model does not claim ownership, authorship or control of a contract. The deploying account is an observation about who submitted a transaction, not a claim about who operates the contract.
  - This model does not assert that a contract is current or active beyond the recorded observation boundary.
  - This model does not resolve the true creation ledger of a contract, only the earliest ledger at which an implementation observed it.
